apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  sources:
    - repoURL: https://github.com/shabbirsaifee92/kagent-demo.git
      targetRevision: main
      path: app/chart
      helm:
        valueFiles:
          - $values/argo-control/apps/demo-app/values.yaml
    - repoURL: https://github.com/shabbirsaifee92/kagent-demo.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
