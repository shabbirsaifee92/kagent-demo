apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rca-agent-readonly
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, configmaps]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-agent-readonly
  namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rca-agent-readonly
subjects:
  - kind: ServiceAccount
    name: rca-agent
    namespace: kagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rca-agent-argo-readonly
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-agent-argo-readonly
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rca-agent-argo-readonly
subjects:
  - kind: ServiceAccount
    name: rca-agent
    namespace: kagent
